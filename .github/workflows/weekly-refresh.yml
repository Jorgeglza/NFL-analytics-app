name: weekly-data-refresh

on:
  schedule:
    # Pinned to US Eastern (games' own clock) so the run tracks the NFL across DST:
    # 01:07 ET = 11:07 PM Monterrey while the US is on EDT, 12:07 AM Monterrey on EST.
    - cron: "7 1 * * 2" # Tuesday 01:07 ET (after Monday Night Football)
      timezone: "America/New_York"
    - cron: "7 1 * * 5" # Friday 01:07 ET (after Thursday Night Football)
      timezone: "America/New_York"
    - cron: "7 1 * * 1" # Monday 01:07 ET (after Sunday Night Football)
      timezone: "America/New_York"
  workflow_dispatch:

permissions:
  contents: write
  actions: write # to trigger deploy.yml after the data commit

# Shared with predictive-refresh.yml: both commit to main, so overlapping runs
# would reject each other's push. Queue instead of cancelling, so no refresh
# is lost (a queued run checks out main after the previous one has pushed).
concurrency:
  group: data-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install pinned dependencies
        run: |
          pip install -r pipeline/requirements.lock.txt
          pip install --no-deps -r pipeline/requirements.nodeps.txt

      - name: Run pipeline
        run: python pipeline/run_pipeline.py --stage all --refresh

      - name: Validate outputs
        run: python pipeline/run_pipeline.py --stage validate

      - name: Commit updated data
        id: autocommit
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "data: weekly refresh"
          file_pattern: "data/nfl.sqlite app/public/data/**"

      # Commits pushed with GITHUB_TOKEN do not fire push-triggered workflows,
      # so the Pages deploy must be dispatched explicitly.
      - name: Trigger deploy
        if: steps.autocommit.outputs.changes_detected == 'true'
        run: gh workflow run deploy.yml --ref main
        env:
          GH_TOKEN: ${{ github.token }}
