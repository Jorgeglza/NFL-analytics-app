name: predictive-model-refresh

on:
  schedule:
    - cron: "7 8 * * 2" # Tuesday 08:07 UTC (after weekly-refresh.yml's data commit)
    - cron: "0 18 * * 5" # Friday 18:00 UTC (after the NFL's official injury report)
  workflow_dispatch:

permissions:
  contents: write
  actions: write # to trigger deploy.yml after the data commit

# Shared with weekly-refresh.yml — see the comment there.
concurrency:
  group: data-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install pinned dependencies
        run: |
          pip install -r pipeline/requirements.lock.txt
          pip install --no-deps -r pipeline/requirements.nodeps.txt

      - name: Run predictive-model export (historical backtest)
        run: python pipeline/predictive_model/export_page.py

      - name: Run predictive-model export (upcoming week)
        run: python pipeline/predictive_model/export_upcoming.py

      - name: Commit updated predictions
        id: autocommit
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "data: predictive model weekly refresh"
          file_pattern: >-
            app/public/data/predictive_model/upcoming.json
            app/public/data/predictive_model/upcoming_meta.json
            app/public/data/predictive_model/upcoming_features.json
            app/public/data/predictive_model/games.json
            app/public/data/predictive_model/game_features.json
            app/public/data/predictive_model/season_summary.json
            app/public/data/predictive_model/importance.json
            app/public/data/predictive_model/calibration.json
            app/public/data/predictive_model/meta.json

      # Commits pushed with GITHUB_TOKEN do not fire push-triggered workflows,
      # so the Pages deploy must be dispatched explicitly.
      - name: Trigger deploy
        if: steps.autocommit.outputs.changes_detected == 'true'
        run: gh workflow run deploy.yml --ref main
        env:
          GH_TOKEN: ${{ github.token }}
